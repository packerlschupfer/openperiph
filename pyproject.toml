[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openperiph"
version = "0.1.1"
description = "Linux configuration tool for gaming peripherals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pyusb"]

[project.scripts]
openperiph = "openperiph.cli:main"
openperiph-gui = "openperiph.gui:main"

[project.entry-points."openperiph.drivers"]
# Built-in drivers are also found by submodule scan, so these entries are
# redundant for a source checkout -- they matter for pip-installed wheels
# and for keeping the driver list introspectable without importing.
x2a = "openperiph.drivers.x2a:PulsarX2A"
x2h = "openperiph.drivers.x2h:PulsarX2H"
x2_wired = "openperiph.drivers.x2_wired:PulsarX2Wired"
xlite_v4 = "openperiph.drivers.xlite_v4:PulsarXliteV4"
xlite_wired = "openperiph.drivers.xlite_wired:PulsarXliteWired"
feinmann8k = "openperiph.drivers.feinmann8k:PulsarFeinmann8K"
nordic = "openperiph.drivers.nordic:PulsarNordic"
# External driver packages register under the same group:
#   mydriver = "my_package.driver:MyDevice"

[tool.setuptools.packages.find]
where = ["src"]
